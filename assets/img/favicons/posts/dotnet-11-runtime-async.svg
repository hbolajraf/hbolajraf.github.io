<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">.NET 11: Runtime Async in one view</title>
  <desc id="desc">An application reaches await, the runtime suspends the task, and execution resumes when work completes. Runtime Async is a preview feature.</desc>
  <rect width="1200" height="630" fill="#f6f4fa"/>
  <circle cx="1105" cy="85" r="190" fill="#ebe5f7"/>
  <rect x="64" y="54" width="88" height="88" rx="19" fill="#512bd4"/>
  <text x="108" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#fff">.NET</text>
  <text x="175" y="82" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2.5" fill="#64577d">DEVELOPMENT NOTES</text>
  <text x="175" y="125" font-family="Georgia,serif" font-size="39" font-weight="700" fill="#21183c">What changes in .NET 11?</text>
  <text x="67" y="214" font-family="Georgia,serif" font-size="47" font-weight="700" fill="#21183c">Runtime Async, at a glance</text>
  <text x="68" y="253" font-family="Arial,sans-serif" font-size="21" fill="#615b6e">A new way to handle suspension and resumption in async code.</text>
  <rect x="67" y="294" width="1066" height="225" rx="22" fill="#fff" stroke="#e2dcec" stroke-width="2"/>
  <path d="M330 390h67m-12-9 12 9-12 9M690 390h67m-12-9 12 9-12 9" fill="none" stroke="#a89ac2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="126" cy="358" r="27" fill="#eee8fb"/><path d="M115 348h23v20h-23z M119 353l4 4-4 4m7 1h7" fill="none" stroke="#512bd4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="111" y="413" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#251a40">Application</text><text x="111" y="448" font-family="Arial,sans-serif" font-size="18" fill="#665d72">Reaches an await</text>
  <circle cx="486" cy="358" r="27" fill="#eee8fb"/><path d="M478 349v18m16-18v18" fill="none" stroke="#512bd4" stroke-width="4" stroke-linecap="round"/>
  <text x="471" y="413" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#251a40">Runtime</text><text x="471" y="448" font-family="Arial,sans-serif" font-size="18" fill="#665d72">Suspends the work</text>
  <circle cx="846" cy="358" r="27" fill="#eee8fb"/><path d="M839 346l17 12-17 12z" fill="#512bd4"/>
  <text x="831" y="413" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#251a40">Resume</text><text x="831" y="448" font-family="Arial,sans-serif" font-size="18" fill="#665d72">Continue when ready</text>
  <rect x="68" y="553" width="147" height="37" rx="18.5" fill="#e7dcfa"/><text x="141" y="577" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#4d2d8a">PREVIEW FEATURE</text>
  <text x="232" y="578" font-family="Arial,sans-serif" font-size="17" fill="#665d72">Opt in and measure on your own workload.</text>
  <text x="1131" y="579" text-anchor="end" font-family="Arial,sans-serif" font-size="15" fill="#857c8f">HASSAN BOLAJRAF BLOG</text>
</svg>
