<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes mutating admission policies</title><desc id="desc">A Pod creation request is scoped to a namespace, receives a default label, and is stored.</desc>
  <rect width="1200" height="630" fill="#f3f7fb"/><circle cx="1090" cy="75" r="180" fill="#e4eefb"/>
  <rect x="68" y="55" width="84" height="84" rx="18" fill="#326ce5"/><g transform="translate(110 97)" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"><circle r="20"/><circle r="5" fill="#fff"/><path d="M0-20v-7M16-13l6-5M19 5l7 2M9 18l3 7M-9 18l-3 7M-19 5l-7 2M-16-13l-6-5M0-5v-11M4-3l8-7M5 1l11 3M2 5l5 9M-2 5l-5 9M-5 1l-11 3M-4-3l-8-7"/></g>
  <text x="178" y="82" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#577493">PLATFORM NOTES / KUBERNETES</text><text x="178" y="124" font-family="Georgia,serif" font-size="39" font-weight="700" fill="#19344e">A safer default</text>
  <text x="68" y="211" font-family="Georgia,serif" font-size="48" font-weight="700" fill="#19344e">Add a label at admission</text><text x="70" y="250" font-family="Arial,sans-serif" font-size="21" fill="#5b7185">A policy changes matching requests; a binding limits where it applies.</text>
  <rect x="68" y="300" width="295" height="210" rx="18" fill="#fff" stroke="#d3e0ed" stroke-width="2"/><text x="95" y="343" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#6888a7">01 / REQUEST</text><text x="95" y="393" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1e405e">Create a Pod</text><text x="95" y="431" font-family="Arial,sans-serif" font-size="18" fill="#627789">In the test namespace</text>
  <path d="M380 405h47m-10-9 10 9-10 9M773 405h47m-10-9 10 9-10 9" fill="none" stroke="#84a9cd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="445" y="300" width="310" height="210" rx="18" fill="#e3effc" stroke="#b5d0eb" stroke-width="2"/><text x="472" y="343" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#6888a7">02 / POLICY</text><text x="472" y="393" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1e405e">Add owner label</text><text x="472" y="431" font-family="Arial,sans-serif" font-size="18" fill="#627789">Only when missing</text>
  <rect x="838" y="300" width="294" height="210" rx="18" fill="#193f68"/><text x="865" y="343" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#b5d5fa">03 / RESULT</text><text x="865" y="393" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">Labeled Pod</text><text x="865" y="431" font-family="Arial,sans-serif" font-size="18" fill="#c4dcf4">Ready for storage</text>
  <text x="70" y="576" font-family="Arial,sans-serif" font-size="16" fill="#7890a7">HASSAN BOLAJRAF BLOG  /  KUBERNETES</text>
</svg>
