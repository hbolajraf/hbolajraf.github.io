<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Build provenance with GitHub Actions</title><desc id="desc">A workflow builds and attests an archive, which a consumer verifies.</desc>
  <rect width="1200" height="630" fill="#f3f7f5"/><circle cx="1090" cy="75" r="180" fill="#e2f0e9"/>
  <rect x="68" y="55" width="84" height="84" rx="18" fill="#24292f"/><g transform="translate(110 97)" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"><circle cx="-13" cy="-15" r="5"/><circle cx="13" cy="-15" r="5"/><circle cx="0" cy="16" r="5"/><path d="M-13-9v10h26V-9M0 1v9"/></g>
  <text x="178" y="82" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#517568">DEVOPS NOTES / GITHUB ACTIONS</text><text x="178" y="124" font-family="Georgia,serif" font-size="39" font-weight="700" fill="#183b34">Trust the build trail</text>
  <text x="68" y="211" font-family="Georgia,serif" font-size="48" font-weight="700" fill="#183b34">From build to verification</text><text x="70" y="250" font-family="Arial,sans-serif" font-size="21" fill="#586e64">Signed provenance helps explain where an artifact came from.</text>
  <rect x="68" y="300" width="295" height="210" rx="18" fill="#fff" stroke="#d3e2d9" stroke-width="2"/><text x="95" y="343" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#588571">01 / BUILD</text><text x="95" y="393" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#173d32">Create archive</text><text x="95" y="431" font-family="Arial,sans-serif" font-size="18" fill="#60776d">Workflow output</text>
  <path d="M380 405h47m-10-9 10 9-10 9M773 405h47m-10-9 10 9-10 9" fill="none" stroke="#6f9e89" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="445" y="300" width="310" height="210" rx="18" fill="#e1f1e9" stroke="#b4d4c1" stroke-width="2"/><text x="472" y="343" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#588571">02 / ATTEST</text><text x="472" y="393" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#173d32">Sign provenance</text><text x="472" y="431" font-family="Arial,sans-serif" font-size="18" fill="#60776d">Bind it to the digest</text>
  <rect x="838" y="300" width="294" height="210" rx="18" fill="#173e33"/><text x="865" y="343" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#acd9c4">03 / VERIFY</text><text x="865" y="393" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">Check the file</text><text x="865" y="431" font-family="Arial,sans-serif" font-size="18" fill="#c3e3d4">Against trusted repo</text>
  <text x="70" y="576" font-family="Arial,sans-serif" font-size="16" fill="#748b7f">HASSAN BOLAJRAF BLOG  /  DEVOPS</text>
</svg>
